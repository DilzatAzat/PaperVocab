name: Release Windows installer

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify release versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $metadata = cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json
          $cargoVersion = ($metadata.packages | Where-Object { $_.name -eq 'papervocab' } | Select-Object -First 1).version
          if ($env:RELEASE_TAG -ne "v$packageVersion" -or $tauriVersion -ne $packageVersion -or $cargoVersion -ne $packageVersion) {
            throw "Version mismatch: tag=$env:RELEASE_TAG package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if (-not (Test-Path "docs/releases/$env:RELEASE_TAG.md")) {
            throw "Missing release notes for $env:RELEASE_TAG"
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tauri build --bundles nsis
      - name: Generate installer checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/PaperVocab_${version}_x64-setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content SHA256SUMS.txt -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          name: PaperVocab ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
